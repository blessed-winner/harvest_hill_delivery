name: Deploy Frontend to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build Image & Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://24.199.93.70
            NEXT_PUBLIC_WS_URL=ws://24.199.93.70
          tags: |
            ghcr.io/hamwenawe/harvesthilldelivery_frontend:latest
            ghcr.io/hamwenawe/harvesthilldelivery_frontend:${{ github.sha }}

      - name: Setup SSH Key for Deployment
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH Host Key to Known Hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          HOST_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC4biVnxfNfPnkEUhk+C6BtdqZCQQsfrKtFA5Fo9XMTS"
          FINGERPRINT=$(echo "$HOST_KEY" | ssh-keygen -l -f - | awk '{print $2}')
          if [ "$FINGERPRINT" != "SHA256:B60mWnb5vy8naOxkPHZrjC5jjPei8gKLzbSL+vyuiu0" ]; then
            echo "Host key fingerprint mismatch! Got: $FINGERPRINT"
            exit 1
          fi
          echo "${{ secrets.SSH_HOST }} $HOST_KEY" >> ~/.ssh/known_hosts

      - name: Transfer docker-compose.yml to Remote Server
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /var/www/harvesthilldelivery_frontend"
          rsync -avz \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }}" \
            ./docker-compose.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/harvesthilldelivery_frontend/docker-compose.yml

      - name: Pull Image and Restart Container on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd /var/www/harvesthilldelivery_frontend
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.SSH_USER }}" --password-stdin
            IMAGE_TAG="${{ github.sha }}" docker compose pull
            IMAGE_TAG="${{ github.sha }}" docker compose up -d --remove-orphans
